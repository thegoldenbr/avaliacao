<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Responder — Radar de Desempenho</title><script src="assets/tema.js"></script><link rel="stylesheet" href="assets/mockup.css"><script src="assets/mockup.js" defer></script></head>
<body>
<div class="publico">
  <header class="publico-topo"><div><span class="marca"><span class="marca-logo" aria-hidden="true">V</span>Serra Azul</span><span class="badge badge--ok"><i data-i="check" data-cls="icone--sm"></i>Salvo</span></div></header>
  <main class="publico-corpo pilha pilha--lg">
    <div class="pilha pilha--sm">
      <div class="linha linha--entre"><span class="muted">Parte 2 de 6 · Finanças</span><span class="num muted">12 de 30</span></div>
      <div class="progresso" role="progressbar" aria-valuenow="12" aria-valuemin="0" aria-valuemax="30" aria-label="Progresso"><span style="--pct:40%"></span></div>
    </div>

    <form class="pilha pilha--lg" onsubmit="return false">
      <fieldset class="pilha">
        <legend><h2 class="leitura" style="font-size:1.1875rem">Com que frequência a empresa confere o fluxo de caixa projetado para os próximos três meses?</h2></legend>
        <p class="muted">Considere os últimos 12 meses.</p>
        <div class="escala" role="radiogroup" aria-label="Nota de 0 a 10">
          <button role="radio" aria-checked="false">0</button><button role="radio" aria-checked="false">1</button><button role="radio" aria-checked="false">2</button><button role="radio" aria-checked="false">3</button><button role="radio" aria-checked="false">4</button><button role="radio" aria-checked="false">5</button><button role="radio" aria-checked="false">6</button><button role="radio" aria-checked="true">7</button><button role="radio" aria-checked="false">8</button><button role="radio" aria-checked="false">9</button><button role="radio" aria-checked="false">10</button>
        </div>
        <div class="escala-extremos"><span>0 · Nunca</span><span>10 · Toda semana</span></div>
      </fieldset>
      <div class="campo"><label for="com">Quer comentar? <span class="muted">(opcional)</span></label><textarea class="textarea" id="com">Fazemos a conferência mensal, mas ainda sem projeção formal.</textarea></div>
    </form>
  </main>
  <div class="barra-fixa"><div><a class="btn btn--sec" href="responder-boas-vindas.html"><i data-i="esq"></i>Anterior</a><a class="btn" href="responder-revisao.html">Próxima<i data-i="dir"></i></a></div></div>
</div>
</body></html>
