<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Visualizador de mockups — Radar de Desempenho</title><script src="assets/tema.js"></script><link rel="stylesheet" href="assets/mockup.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; }
  .barra { display: flex; gap: .75rem 1.25rem; flex-wrap: wrap; align-items: center; padding: .625rem 1rem; border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
  .barra .grupo { display: flex; gap: .25rem; align-items: center; }
  .palco { flex: 1; overflow: auto; padding: 1rem; display: flex; justify-content: center; align-items: flex-start; }
  .aparelho { border: 1px solid var(--color-border-strong); border-radius: 12px; overflow: hidden; background: var(--color-background); transform-origin: top left; }
  .aparelho iframe { border: 0; display: block; width: 100%; height: 100%; }
</style></head>
<body>
<div class="barra" role="toolbar" aria-label="Opções de visualização">
  <a class="btn btn--ghost btn--sm" href="index.html">Índice</a>
  <label class="grupo">Tela <select class="select" id="tela" style="width:auto"></select></label>
  <div class="grupo" role="group" aria-label="Tema"><button class="chip" data-tema="claro">Claro</button><button class="chip" data-tema="escuro">Escuro</button></div>
  <div class="grupo" role="group" aria-label="Largura"><button class="chip" data-w="390">Celular 390</button><button class="chip" data-w="768">Tablet 768</button><button class="chip" data-w="1440">Desktop 1440</button></div>
  <div class="grupo" role="group" aria-label="Tipografia"><button class="chip" data-fonte="a">Fonte A · IBM Plex Sans</button><button class="chip" data-fonte="b">Fonte B · Figtree</button></div>
</div>
<div class="palco" id="palco"><div class="aparelho" id="ap"><iframe id="fr" title="Mockup"></iframe></div></div>
<script>
(function () {
  var TELAS = [
    ['login', 'Login'], ['inicio', 'Início'], ['empresas', 'Empresas — lista'], ['empresa-cadastro', 'Empresas — cadastro'],
    ['questionario-editor', 'Editor de questionário'], ['avaliacao-nova', 'Avaliação — criação'], ['avaliacao-compartilhar', 'Avaliação — compartilhamento'],
    ['responder-boas-vindas', 'Formulário — boas-vindas'], ['responder-pergunta', 'Formulário — pergunta'], ['responder-revisao', 'Formulário — revisão'],
    ['responder-agradecimento', 'Formulário — agradecimento'], ['responder-encerrado', 'Formulário — link encerrado'],
    ['avaliacao-detalhe', 'Detalhe da avaliação'], ['relatorio-editor', 'Editor do relatório'], ['dashboard-cliente', 'Dashboard do cliente'],
    ['configuracoes', 'Configurações'], ['pdf', 'PDF (A4)']
  ];
  var p = new URLSearchParams(location.search);
  var st = { tela: p.get('tela') || 'login', tema: document.documentElement.dataset.tema, w: +(p.get('w') || 390), fonte: document.documentElement.dataset.fonte };
  var sel = document.getElementById('tela'), fr = document.getElementById('fr'), ap = document.getElementById('ap'), palco = document.getElementById('palco');
  sel.innerHTML = TELAS.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('');
  function aplicar() {
    sel.value = st.tela;
    document.querySelectorAll('[data-tema]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.tema === st.tema); });
    document.querySelectorAll('[data-w]').forEach(function (b) { b.setAttribute('aria-pressed', +b.dataset.w === st.w); });
    document.querySelectorAll('[data-fonte]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.fonte === st.fonte); });
    document.documentElement.dataset.tema = st.tema; document.documentElement.dataset.fonte = st.fonte;
    fr.src = st.tela + '.html?tema=' + st.tema + '&fonte=' + st.fonte;
    var disp = palco.clientWidth - 32, esc = Math.min(1, disp / st.w), h = (palco.clientHeight - 32) / esc;
    ap.style.width = st.w + 'px'; ap.style.height = Math.max(h, 600) + 'px'; ap.style.transform = 'scale(' + esc + ')';
    ap.style.marginBottom = (-(ap.offsetHeight * (1 - esc))) + 'px'; ap.style.marginRight = (-(st.w * (1 - esc))) + 'px';
    history.replaceState(null, '', '?tela=' + st.tela + '&tema=' + st.tema + '&w=' + st.w + '&fonte=' + st.fonte);
  }
  sel.addEventListener('change', function () { st.tela = sel.value; aplicar(); });
  document.querySelector('.barra').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tema) st.tema = b.dataset.tema; if (b.dataset.w) st.w = +b.dataset.w; if (b.dataset.fonte) st.fonte = b.dataset.fonte;
    aplicar();
  });
  addEventListener('resize', aplicar);
  aplicar();
})();
</script>
</body></html>
