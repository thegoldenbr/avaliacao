<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Entrar — Radar de Desempenho</title><script src="assets/tema.js"></script><link rel="stylesheet" href="assets/mockup.css"><script src="assets/mockup.js" defer></script></head>
<body>
<div class="centro">
  <main class="caixa pilha pilha--lg">
    <div class="pilha pilha--sm">
      <span class="marca-logo marca-logo--lg" aria-hidden="true">V</span>
      <h1>Entrar no Radar</h1>
      <p class="muted">Vértice Consultoria · área interna</p>
    </div>
    <form class="pilha" onsubmit="return false">
      <div class="campo">
        <label for="email">E-mail</label>
        <input class="input" id="email" type="email" inputmode="email" autocomplete="username" value="marina@verticeconsultoria.example">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input class="input" id="senha" type="password" autocomplete="current-password" value="••••••••••">
      </div>
      <button class="btn btn--bloco" type="submit">Entrar</button>
      <a class="linha" href="#">Esqueci minha senha</a>
    </form>
    <div class="aviso aviso--erro" role="alert">
      <i data-i="info"></i>
      <p><b>E-mail ou senha incorretos.</b> Confira os dados e tente de novo, ou use “Esqueci minha senha”.</p>
    </div>
  </main>
</div>
</body></html>
