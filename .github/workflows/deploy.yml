name: Deploy no GitHub Pages

# A cada push na main: roda os testes e publica o site estático (HTML + JS, sem build) e os mockups em /mockups/.
# A URL do projeto e a chave publishable do Supabase (públicas) ficam em js/config.js.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:banco
      - name: Montar o site (só o que o navegador precisa)
        run: |
          mkdir _site
          cp -r *.html css js fonts vendor mockups .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
